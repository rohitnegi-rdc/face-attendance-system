# Throwaway Postgres for the regression suite (scripts/run-regression.mjs). Data lives in tmpfs,
# so every run starts from init.sql + migrations and nothing touches dev or production data.
name: fa-regression
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: regression
      POSTGRES_DB: attendance
      TZ: Asia/Kolkata
    ports:
      - '127.0.0.1:${REGRESSION_DB_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1: the temporary server used while init.sql runs listens on the socket only,
      # so this passes only once the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U attendance -d attendance']
      interval: 2s
      timeout: 3s
      retries: 30
