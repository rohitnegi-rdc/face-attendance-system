services:
  # PostgreSQL is only needed by the app and worker on Docker's internal network.
  # Not published locally: nothing on the host needs it.
  postgres:
    ports: !reset []

  # Local testing never sends real email: approval mails are written to the app log instead.
  app:
    environment:
      MAIL_LOG_ONLY: 'true'

  lan-https:
    build: .
    command: ['node', 'scripts/lan-https-proxy.mjs']
    environment:
      LAN_HTTPS_PORT: '6103'
      UPSTREAM_HOST: app
      UPSTREAM_PORT: '3000'
    ports:
      - '6103:6103'
    volumes:
      - ./.lan-tls:/tls:ro
    depends_on:
      - app
