services:
  # Local testing never sends real email, whatever the env file says: mails go to the log instead.
  app:
    environment:
      MAIL_ENABLED: 'false'
  worker:
    environment:
      MAIL_ENABLED: 'false'

  lan-https:
    build: .
    command: ['node', 'scripts/lan-https-proxy.mjs']
    environment:
      LAN_HTTPS_PORT: '6103'
      UPSTREAM_HOST: app
      UPSTREAM_PORT: '3000'
      # Passed through only when set (see scripts/lan-https-proxy.mjs).
      ORIGIN:
    ports:
      - '6103:6103'
    volumes:
      - ./.lan-tls:/tls:ro
    depends_on:
      - app
